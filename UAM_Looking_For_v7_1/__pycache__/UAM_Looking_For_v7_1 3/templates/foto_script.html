<script>
    // Reduce la foto en el navegador ANTES de enviarla (sin librerías, con <canvas>):
    // 1) la achica a 1280 px como máximo por lado, 2) la vuelve a comprimir en WebP (o JPEG si el navegador
    // no sabe crear WebP) bajando la calidad hasta que pese unos 150 KB, 3) quita los datos ocultos de la foto
    // (como la ubicación GPS del celular). El servidor vuelve a revisar peso, formato y medidas.
    const OBJETIVO = 150 * 1024, MAXIMO = 300 * 1024;
    const kb = bytes => (bytes / 1024).toFixed(0) + ' KB';
    const aBlob = (lienzo, tipo, calidad) => new Promise(listo => lienzo.toBlob(listo, tipo, calidad));

    async function comprimir(original) {
        const img = new Image();
        img.src = URL.createObjectURL(original);
        await img.decode();
        for (const lado of [1280, 1024, 800]) {   // si a 1280 px no baja del máximo, se prueba más pequeña
            const escala = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
            const lienzo = document.createElement('canvas');
            lienzo.width = Math.round(img.naturalWidth * escala);
            lienzo.height = Math.round(img.naturalHeight * escala);
            const ctx = lienzo.getContext('2d');
            ctx.fillStyle = '#fff';   // fondo blanco para fotos PNG con transparencia
            ctx.fillRect(0, 0, lienzo.width, lienzo.height);
            ctx.drawImage(img, 0, 0, lienzo.width, lienzo.height);
            for (let calidad = 0.82; calidad >= 0.5; calidad -= 0.08) {
                let blob = await aBlob(lienzo, 'image/webp', calidad);
                if (!blob || blob.type !== 'image/webp') blob = await aBlob(lienzo, 'image/jpeg', calidad);
                if (blob.size <= OBJETIVO || (calidad < 0.58 && blob.size <= MAXIMO)) {
                    return {blob, ancho: lienzo.width, alto: lienzo.height};
                }
            }
        }
        throw new Error('muy pesada');
    }

    document.querySelectorAll('input[type=file][data-foto]').forEach(input => {
        const zona = input.closest('[data-zona-foto]');
        const vista = zona.querySelector('.vista-foto');
        const info = zona.querySelector('.zona-foto-info');
        const botonZona = zona.querySelector('.zona-foto-boton');
        const ayuda = info.textContent;
        const boton = input.form.querySelector('[type=submit]');
        const sinFoto = mensaje => {   // vuelve la zona a su aspecto inicial
            vista.hidden = true;
            zona.classList.remove('con-vista');
            botonZona.textContent = 'Buscar foto';
            info.textContent = mensaje;
        };
        input.addEventListener('change', async () => {
            const original = input.files[0];
            if (!original) return sinFoto(ayuda);
            sinFoto('');
            if (!original.type.startsWith('image/')) {
                info.textContent = 'El archivo elegido no es una imagen.';
                input.value = '';
                return;
            }
            info.textContent = 'Reduciendo la foto…';
            boton.disabled = true;
            try {
                const {blob, ancho, alto} = await comprimir(original);
                const extension = blob.type === 'image/webp' ? 'webp' : 'jpg';
                const lista = new DataTransfer();   // reemplaza el archivo elegido por el comprimido
                lista.items.add(new File([blob], 'foto.' + extension, {type: blob.type}));
                input.files = lista.files;
                vista.src = URL.createObjectURL(blob);
                vista.hidden = false;
                zona.classList.add('con-vista');
                botonZona.textContent = 'Cambiar foto';
                info.textContent = `Foto lista: ${kb(original.size)} → ${kb(blob.size)} · ${ancho}×${alto} px · ${extension.toUpperCase()}`;
            } catch (e) {
                info.textContent = 'No se pudo procesar la imagen. Prueba con otra foto (JPG, PNG o WebP).';
                input.value = '';
            }
            boton.disabled = false;
        });

        // Arrastrar y soltar: la foto soltada entra al mismo campo y pasa por la misma reducción.
        ['dragenter', 'dragover'].forEach(tipo => zona.addEventListener(tipo, e => {
            if (!traeArchivos(e)) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            zona.classList.add('arrastrando');
        }));
        zona.addEventListener('dragleave', e => {
            if (!zona.contains(e.relatedTarget)) zona.classList.remove('arrastrando');
        });
        zona.addEventListener('drop', e => {
            if (!traeArchivos(e)) return;
            e.preventDefault();
            zona.classList.remove('arrastrando');
            const lista = new DataTransfer();   // solo la primera, aunque suelten varias
            lista.items.add(e.dataTransfer.files[0]);
            input.files = lista.files;
            input.dispatchEvent(new Event('change'));
        });
    });

    // Si la foto cae fuera de la zona, el navegador no la abre (se perdería lo escrito en el formulario).
    function traeArchivos(e) {
        return e.dataTransfer && [...e.dataTransfer.types].includes('Files');
    }
    ['dragover', 'drop'].forEach(tipo => window.addEventListener(tipo, e => {
        if (traeArchivos(e) && !(e.target.closest && e.target.closest('[data-zona-foto]'))) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'none';
        }
    }));

    // Evita enviar el mismo formulario dos veces con un doble clic.
    document.querySelectorAll('form[data-un-envio]').forEach(form => form.addEventListener('submit', () => {
        setTimeout(() => form.querySelectorAll('[type=submit]').forEach(b => b.disabled = true), 0);
    }));
</script>
